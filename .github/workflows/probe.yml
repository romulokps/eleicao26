name: probe
on:
  push:
    branches: ['claude/**']
    paths: ['src/probe*.py', '.github/workflows/probe.yml', 'probe_args.txt']
  workflow_dispatch:
    inputs:
      args:
        description: "argumentos para o script"
        default: ""
      script:
        description: "script em src/"
        default: "probe.py"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: sonda
        run: |
          if [ -n "${{ inputs.script }}" ]; then python src/${{ inputs.script }} ${{ inputs.args }};
          else bash -c "python $(cat probe_args.txt)"; fi
