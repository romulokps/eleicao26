name: sonda
on:
  push:
    branches: ["claude/**"]
    paths: ["src/sonda_*.py"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q httpx==0.27.2
      - run: for f in src/sonda_*.py; do python "$f"; done
